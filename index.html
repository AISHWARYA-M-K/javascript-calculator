<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <h1>Calculator</h1>
    <div id="form">
    <form>
        <label for="num1">Number 01:</label>
        <input type="number" id="num1" name="num" required>
        <label for="num2">Number 02:</label>
        <input type="number" id="num2" name="num" required>
        <button type="button" id="addButton">Add</button>
        <label for="addresult">Result:</label>
        <input type="number" id="addresult" name="addresult" readonly>
        <button type="button" id="subtractButton">Subtract</button>
        <label for="subtractresult">Result:</label>
        <input type="number" id="subtractresult" name="subtractresult" readonly>
        <button type="button" id="multiplyButton">Multiply</button>
        <label for="multiplyresult">Result:</label>
        <input type="number" id="multiplyresult" name="multiplyresult" readonly>
        <button type="button" id="divideButton">Divide</button>
        <label for="divideresult">Result:</label>
        <input type="number" id="divideresult" name="divideresult" readonly>
    </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
